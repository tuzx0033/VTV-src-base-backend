root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  full_bin = "./tmp/api -env dev"
  include_ext = ["go", "yaml", "sql"]
  exclude_dir = ["tmp", "bin", "docs", "vendor", "migrations"]
  delay = 500
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
