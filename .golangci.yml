# golangci-lint config. Greenfield: lint everything (no `new: true`).
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - gofmt
    - goimports
    - revive
    - bodyclose
    - errorlint
    - nilerr
    - misspell

linters-settings:
  goimports:
    local-prefixes: vtv.vn
  revive:
    rules:
      - name: function-length
        arguments: [100, 0]
      - name: cyclomatic
        arguments: [15]
      - name: cognitive-complexity
        arguments: [15]
      - name: unhandled-error
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck, bodyclose]
    - path: cmd/
      linters: [revive] # main()s can be a bit longer
